name: Reservation Watch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force_notify:
        description: "Send a Discord test notification even when no slots are available"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      discord_debug:
        description: "Log Discord message id and channel id after notification"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      scan_debug:
        description: "Log visible clickable controls when next week cannot be clicked"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

concurrency:
  group: reservation-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check reservation
        env:
          WATCH_URL: ${{ secrets.WATCH_URL || vars.WATCH_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTION: ${{ secrets.DISCORD_MENTION }}
          CLICK_TEXTS: ${{ secrets.CLICK_TEXTS }}
          MENU_TEXTS: ${{ secrets.MENU_TEXTS }}
          CONFIRM_TEXT: ${{ vars.CONFIRM_TEXT || 'メニューを確定する' }}
          SCAN_NEXT_COUNT: ${{ vars.SCAN_NEXT_COUNT || '1' }}
          NEXT_WEEK_TEXTS: ${{ vars.NEXT_WEEK_TEXTS || '翌週|次週|次へ' }}
          FORCE_NOTIFY: ${{ inputs.force_notify || 'false' }}
          DISCORD_DEBUG: ${{ inputs.discord_debug || 'false' }}
          SCAN_DEBUG: ${{ inputs.scan_debug || 'false' }}
          STATE_FILE: state/notified-slots.json
          CHROME_PATH: /usr/bin/google-chrome-stable
          WRITE_STATUS_STATE: "false"
        run: |
          if [[ -z "$WATCH_URL" || -z "$DISCORD_WEBHOOK_URL" || -z "$CLICK_TEXTS" ]]; then
            echo "::notice::Set WATCH_URL, DISCORD_WEBHOOK_URL, and CLICK_TEXTS before enabling reservation checks."
            exit 0
          fi

          npm run watch:once

      - name: Commit notification state
        run: |
          if [[ -z "$(git status --porcelain state/notified-slots.json)" ]]; then
            echo "No new notification state."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/notified-slots.json
          git commit -m "state: update notified reservation slots"
          git push
